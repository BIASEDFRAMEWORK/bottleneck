environments:
  default:
    assurance:
      min_accuracy: 0.90
      max_failures: 0

    execution:
      max_error_rate: 0.05
      min_adoption: 0.5
      telemetry:
        max_age_hours: 168
        min_deployments_per_week: 1
        max_change_failure_rate: 0.15
        max_error_rate: 0.05
        max_user_override_rate: 0.10
        min_adoption_rate: 0.50
        max_budget_variance: 0.20

    security:
      sarif:
        max_critical: 0
        max_high: 0
        max_medium: 5
        max_low: 20
        fail_on_unknown_severity: false

    gate:
      release:
        min_primary_score: 60
        required_categories:
          - Intent
          - Behavior
          - Assurance
          - Security
          - Execution
        require_traceability: true
        require_governance: false

  dev:
    assurance:
      min_accuracy: 0.85

  test:
    assurance:
      min_accuracy: 0.90

  stage:
    assurance:
      min_accuracy: 0.93

  production:
    assurance:
      min_accuracy: 0.95
    gate:
      release:
        min_primary_score: 75
        require_traceability: true
        require_governance: true
