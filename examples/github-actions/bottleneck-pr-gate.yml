name: bottleneck PR gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: bottleneck environment to validate
        default: production
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bottleneck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build bottleneck
        run: go build -o bottleneck .

      - name: Validate and score pull request
        id: bottleneck
        env:
          BOTTLENECK_ENV: ${{ github.event.inputs.environment || 'production' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./bottleneck validate --env="$BOTTLENECK_ENV" --strict --github-annotations
          VALIDATE_EXIT=$?
          ./bottleneck scorecard --env="$BOTTLENECK_ENV" --view=governance --format=markdown > bottleneck-scorecard.md
          SCORECARD_EXIT=$?
          {
            echo "<!-- bottleneck-scorecard -->"
            cat bottleneck-scorecard.md
          } > bottleneck-pr-comment.md
          cat bottleneck-scorecard.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$VALIDATE_EXIT" -ne 0 ]; then
            exit "$VALIDATE_EXIT"
          fi
          if [ "$SCORECARD_EXIT" -ne 0 ]; then
            exit "$SCORECARD_EXIT"
          fi

      - name: Upsert PR scorecard comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bottleneck-scorecard -->';
            const body = fs.readFileSync('bottleneck-pr-comment.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
